<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EasyNote">
  <title>EasyNote</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <section id="splash" class="splash">
      <div class="splash-inner">
        <div class="splash-brand">EasyNote</div>
        <p id="splash-quote" class="splash-quote"></p>
        <div class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </section>
    <section id="auth-screen" class="auth-screen" hidden>
      <div class="auth-panel">
        <h1>轻松记</h1>
        <div class="auth-tabs">
          <button id="auth-login-tab" class="auth-tab active" type="button">登录</button>
          <button id="auth-register-tab" class="auth-tab" type="button">注册</button>
        </div>
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="auth-password" placeholder="至少 6 位" autocomplete="current-password">
        </div>
        <button id="auth-submit-btn" class="primary-btn" type="button">登录</button>
        <button id="local-dev-btn" class="secondary-btn auth-local-btn" type="button" hidden>本地测试，不登录</button>
        <button id="auth-resend-btn" class="secondary-btn auth-resend-btn" type="button" hidden>重发验证邮件</button>
        <p id="auth-status" class="auth-status"></p>
      </div>
    </section>

    <div id="app-shell" hidden>
      <header id="header">
        <h1 class="header-title">轻松记</h1>
        <button id="settings-btn" class="icon-btn" aria-label="设置">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </header>

      <main id="main">

      <!-- Capture Tab -->
      <section id="tab-capture" class="tab-content active">
        <div id="daily-quote-banner" class="daily-quote-banner" hidden>
          <span id="daily-quote-text" class="daily-quote-text"></span>
          <button id="daily-quote-close" class="daily-quote-close" type="button" aria-label="关闭每日一句">✕</button>
        </div>
        <div class="capture-card">
          <div class="capture-head">
            <span class="capture-kicker">快速记录</span>
            <span id="capture-today-label" class="capture-date"></span>
          </div>
          <textarea id="capture-input" placeholder="记录任何事..." enterkeyhint="done" autofocus></textarea>
          <button id="save-btn" type="button">保存</button>
        </div>
        <div class="recent-section">
          <p class="section-label">最近记录</p>
          <div id="recent-list"></div>
        </div>
      </section>

      <!-- Today Tab -->
      <section id="tab-today" class="tab-content">
        <!-- Summary area -->
        <div class="today-summary-panel">
          <div id="today-summary-idle" class="summary-top-card">
            <div>
              <span id="today-entry-count" class="summary-count"></span>
              <p class="summary-subtle">把今天的零散记录整理成一页。</p>
            </div>
            <button id="today-gen-btn" class="summary-gen-btn">生成总结 →</button>
          </div>
          <div id="today-summary-loading" class="summary-loading-card" hidden>
            <div class="summary-loading-head">
              <div class="spinner-sm"></div>
              <div class="summary-loading-copy">
                <span id="today-summary-loading-text">正在归纳今天的内容...</span>
                <div class="summary-progress-track">
                  <div id="today-summary-progress-bar" class="summary-progress-bar"></div>
                </div>
              </div>
              <span id="today-summary-progress-text" class="summary-progress-text">0%</span>
            </div>
            <div id="today-summary-stream" class="summary-stream-preview" hidden></div>
            <button id="today-summary-cancel-btn" class="summary-cancel-btn" type="button">取消</button>
          </div>
          <div id="today-summary-result" hidden>
            <div class="summary-row">
              <button id="today-regen-btn" class="summary-action-btn" type="button">重新整理</button>
              <button id="today-edit-btn" class="summary-action-btn subtle" type="button">编辑</button>
            </div>
            <div id="today-summary-preview" class="summary-card"></div>
            <textarea id="today-summary-text" class="summary-card summary-textarea" hidden></textarea>
            <button id="today-add-kanban-btn" class="kanban-cta-btn" type="button" hidden>加入看板</button>
          </div>
        </div>

      </section>

      <!-- Kanban Tab -->
      <section id="tab-kanban" class="tab-content">
        <div class="kanban-toolbar">
          <div class="tag-filter">
            <button id="kanban-filter-trigger" class="tag-filter-trigger" type="button" aria-expanded="false">
              <span id="kanban-filter-label">Todo</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>
            <div id="kanban-filters" class="tag-filter-menu" hidden>
              <button class="tag-filter-option active" data-filter="todo">Todo</button>
              <button class="tag-filter-option" data-filter="reminder">提醒</button>
              <button class="tag-filter-option" data-filter="quote">好句</button>
              <button class="tag-filter-option" data-filter="thought">感触</button>
              <button class="tag-filter-option" data-filter="all">全部</button>
            </div>
          </div>
          <div class="date-segment" id="kanban-date-filters">
            <button class="date-segment-btn active" data-date="today">今天</button>
            <button class="date-segment-btn" data-date="week">近 7 日</button>
            <button class="date-segment-btn" data-date="other" id="cal-trigger">其他</button>
          </div>
        </div>
        <div class="status-filter" id="kanban-status-filters">
          <button class="status-filter-btn active" data-status="open">未完成</button>
          <button class="status-filter-btn" data-status="done">已完成</button>
        </div>
        <div class="kanban-search-wrap">
          <input id="kanban-search" class="kanban-search" type="search" placeholder="搜索看板..." autocomplete="off">
        </div>
        <div id="kanban-list"></div>
        <button id="kanban-clear-done-btn" class="ghost-btn kanban-clear-btn" hidden>清除已完成</button>
        <div id="kanban-empty" class="empty-state" hidden>
          <div class="empty-icon">📋</div>
          <p>看板空空如也</p>
          <p class="empty-sub">记录里的待办会出现在这里</p>
        </div>
      </section>

      <!-- Archive (信箱) Tab -->
      <section id="tab-archive" class="tab-content">
        <div id="archive-list-view">
          <div class="archive-toolbar">
            <input id="archive-search" class="archive-search" type="search" placeholder="搜索信里的内容或日期..." />
            <div class="archive-filter-row">
              <div class="date-segment" id="archive-date-filters">
                <button class="date-segment-btn active" data-range="all">全部</button>
                <button class="date-segment-btn" data-range="7">近 7 日</button>
                <button class="date-segment-btn" data-range="30">近 30 日</button>
              </div>
              <button id="archive-fav-filter" class="archive-fav-filter" type="button" aria-pressed="false">☆ 收藏</button>
            </div>
          </div>
          <div id="archive-list"></div>
          <div id="archive-empty" class="empty-state" hidden>
            <div class="empty-icon">✉️</div>
            <p>信箱还是空的</p>
            <p class="empty-sub">每天会自动写一封信，归档到这里</p>
          </div>
        </div>
        <div id="archive-detail" hidden>
          <div class="archive-detail-top">
            <button id="archive-back-btn" class="ghost-btn archive-back">← 返回</button>
            <div class="archive-detail-actions">
              <button id="archive-share-btn" class="ghost-btn archive-share" type="button">分享</button>
              <button id="archive-fav-btn" class="ghost-btn archive-fav" type="button" aria-pressed="false">☆ 收藏</button>
            </div>
          </div>
          <article class="letter">
            <div id="archive-letter-date" class="letter-date"></div>
            <div id="archive-letter-body" class="letter-body"></div>
          </article>
          <div class="reflection-block">
            <p class="section-label">附笔 · 我的补充</p>
            <textarea id="archive-reflection" placeholder="写下这一天的额外反思或后续想法..."></textarea>
            <button id="archive-reflection-save" class="ghost-btn">保存补充</button>
          </div>
        </div>
      </section>

      </main>

      <nav id="bottom-nav">
      <button class="nav-btn active" data-tab="capture">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span>记录</span>
      </button>
      <button id="today-nav-btn" class="nav-btn" data-tab="today">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>今日</span>
        <span id="today-nav-progress" class="nav-progress" hidden>0%</span>
      </button>
      <button class="nav-btn" data-tab="kanban">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="5" height="15" rx="1"/>
        </svg>
        <span>看板</span>
      </button>
      <button class="nav-btn" data-tab="archive">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
        </svg>
        <span>信箱</span>
      </button>
      </nav>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal" hidden>
      <div class="modal-backdrop" id="modal-backdrop"></div>
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-header">
          <h2>设置</h2>
          <button id="close-settings-btn" class="icon-btn close-btn">✕</button>
        </div>
        <div class="settings-body">
          <p class="settings-section-label">AI 助手</p>
          <div class="form-group">
            <label for="setting-api-key">DeepSeek 密钥</label>
            <input type="password" id="setting-api-key" placeholder="粘贴 sk- 开头的密钥" autocomplete="off">
            <p class="form-hint">用于生成每日总结和信件。退出账号后，这台设备不会保留密钥。</p>
          </div>
          <button id="advanced-settings-toggle" class="advanced-settings-toggle" type="button" aria-expanded="false">高级设置</button>
          <div id="advanced-settings" hidden>
            <div class="form-group">
              <label for="setting-base-url">服务地址 <span class="label-hint">（一般不用修改）</span></label>
              <input type="url" id="setting-base-url" placeholder="https://api.deepseek.com">
            </div>
            <label id="custom-endpoint-warning" class="endpoint-warning" hidden>
              <input id="setting-custom-endpoint-approved" type="checkbox">
              <span>这不是 DeepSeek 官方地址。仅在你信任这个地址时继续。</span>
            </label>
          </div>

          <p class="settings-section-label">账号</p>
          <p id="account-email" class="account-email"></p>
          <p id="sync-status" class="sync-status">未配置同步</p>
          <button id="sign-out-btn" class="secondary-btn" type="button">退出账号</button>

          <button id="save-settings-btn" class="primary-btn" style="margin-top:8px">保存</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <!-- Calendar overlay -->
    <div id="cal-overlay" class="cal-overlay" hidden>
      <div class="cal-backdrop" id="cal-backdrop"></div>
      <div class="cal-sheet">
        <div class="modal-handle"></div>
        <div class="cal-toolbar">
          <button id="cal-prev" class="cal-nav">‹</button>
          <span id="cal-title" class="cal-title"></span>
          <button id="cal-next" class="cal-nav">›</button>
        </div>
        <div class="cal-weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div id="cal-grid" class="cal-grid"></div>
        <div class="cal-actions">
          <button id="cal-close" class="cal-action-btn cal-action-ghost">关闭</button>
          <button id="cal-confirm" class="cal-action-btn cal-action-primary">完成</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
